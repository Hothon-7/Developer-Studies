<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    Velocidade do carro <input type="number" name="txtvel" id="txtvel"> KM/h
    <input type="button" value="verificar" onclick="calcular()">
    <div id="res">

    </div>
    <script>
        
        function calcular(){
            var txtv = window.document.querySelector('input#txtvel')
            var res = window.document.querySelector('div#res')
            var vel = Number(txtv.value)
            res.innerHTML = `<p>A sua velocidade atual é <strong> ${vel} </strong> KM/h </p>`
            if (vel > 60) {
                res.innerHTML += '<p> Você esta <strong> MULTADO </strong> por excesso de velocidade'
                    //else if foi eu quem add
            } else if (vel < 40) {
                res.innerHTML += '<p> Você esta <strong> MULTADO </strong> por dirigir muito abaixo da velocidade'
            }
            res.innerHTML += '<p>Dirija sempre com segurança!</p>'
        }
    </script>
</body>
</html>
