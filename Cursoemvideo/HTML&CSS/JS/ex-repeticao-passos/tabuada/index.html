<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tábuada</title>
</head>
<body>
    <header>
        <h1> Tábuada </h1>
    </header>
    <section>
        <div>
            <p>
                <label for="txtn">Número:</label> <input type="number" name="num" id="txtn">
                <input type="button" value="Gerar Tabuada" onclick="gerarTabuada()">
            </p>
        </div>
        <div>
            <label for="seltab">Escolha a tabuada:
            </label>
            <select name="tabuada" id="seltab" size="10">
                <option>
                    Digite um número e clique em "Gerar Tabuada" para ver a tabuada aqui.
                </option>
            </select>
        </div>
    </section>
    <footer>
        <p>&copy; Curso em vídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
